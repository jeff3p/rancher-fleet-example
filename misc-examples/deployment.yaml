apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-helloworld
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golang-helloworld
  template:
    metadata:
      labels:
        app: golang-helloworld
    spec:
      containers:
        - name: golang-helloworld
          image: quay.io/jfronius/golang-helloworld:2026-09-22
          ports:
            - containerPort: 8080
          env:
            - name: DISPLAY_GREETING
              value: "true"
            - name: MAX_ITEMS
              value: "150"
            - name: RETRY_COUNT
              value: "15"
          volumeMounts:
            - name: pv-data
              mountPath: /pv-data
      volumes:
        - name: pv-data
          persistentVolumeClaim:
            claimName: golang-helloworld-pvc
